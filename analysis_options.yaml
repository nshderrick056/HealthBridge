
# Dart and Flutter static analysis configuration.
# Recommended lint rules help maintain consistent code quality.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - server/**
    - dashboard/**

linter:
  rules:
    # Additional lint rules can be enabled here.
    # avoid_print: false
    # prefer_single_quotes: true
